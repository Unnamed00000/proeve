    <path d="M237 330 C237 374 268 401 307 403 C335 405 356 421 356 450" fill="none" stroke="url(#steel)" stroke-width="12" stroke-linecap="round"/>

    <circle cx="356" cy="415" r="64" fill="url(#disc)"/>
