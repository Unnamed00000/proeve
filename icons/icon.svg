      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d6d9da"/>
      <stop offset="0.8" stop-color="#777c80"/>
      <stop offset="1" stop-color="#232629"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#ffffff"/>
  <rect x="9" y="9" width="494" height="494" rx="104" fill="none" stroke="#e4e7e7" stroke-width="8"/>

