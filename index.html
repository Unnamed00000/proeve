<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#176b5d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="EKG Quiz">
    <title>EKG repetition</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <button class="icon-button hidden" id="backToMaterials" type="button" aria-label="Tilbage til emner">
          <span aria-hidden="true">‹</span>
        </button>
        <div>
          <p class="eyebrow">Personlig træning</p>
          <h1 id="screenTitle">EKG repetition</h1>
        </div>
      </header>

      <section class="screen" id="materialsScreen">
        <div class="intro">
          <h2>Vælg et emne</h2>
          <p>Åbn et emne, svar med A, B, C eller D, og brug forklaringerne til at repetere stoffet.</p>
        </div>
        <div class="materials-grid" id="materialsGrid"></div>
      </section>

      <section class="screen hidden" id="quizScreen" aria-live="polite">
        <div class="quiz-toolbar">
          <div>
            <p class="eyebrow" id="materialLabel">Emne</p>
            <h2 id="questionCounter">Spørgsmål 1</h2>
          </div>
          <div class="score-pill" id="scorePill">0 / 0</div>
        </div>

        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <article class="question-panel">
          <p class="question-text" id="questionText"></p>
          <div class="answers" id="answersList"></div>
          <p class="feedback" id="feedbackText"></p>
        </article>

        <nav class="pager" aria-label="Navigation mellem spørgsmål">
          <button class="secondary-button" id="prevQuestion" type="button">Forrige side</button>
          <button class="primary-button" id="nextQuestion" type="button">Næste side</button>
        </nav>
      </section>
    </main>

    <script src="questions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
